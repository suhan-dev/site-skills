<!-- Intro markup. Copy the HEAD part into <head> (before the stylesheets load), the BODY part as the first child of <body>,
     and wrap the rest of the page in <div id="app" class="app">. Replace {{SITE_NAME}} and the headlines. -->

<!-- ===== HEAD ===== -->
<!-- the stage colour before any CSS arrives: no white flash under the intro -->
<style>html.intro-on,html.intro-on body{background:#111216}</style>
<link rel="stylesheet" href="/css/intro.css">
<!-- three.js r170 from your own server (assets/fetch-vendor.sh); never from a CDN at run time -->
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.min.js","three/addons/":"/vendor/three/addons/"}}</script>
<script>
/* Show the intro once per tab, only on "/" with no #hash and no deep link in the address. Never on phones (≤760 px wide,
   or a phone on its side): they open straight on the app. html.ix-login: just signed in (the sign-in page sets
   intro_arrive in sessionStorage), so the intro starts on the sign-in background and the title rises.
   ?arrive=login and ?ui=0 are for stills. Runs before the first paint, so the right layout is there from the start. */
(function(){var c=document.documentElement.classList,q=location.search,show=false,login=/[?&]arrive=login\b/.test(q);
try{show=!sessionStorage.getItem("intro_seen")&&!location.hash&&!/[?&](date|event)=/.test(q)&&!matchMedia("(max-width:760px),(pointer:coarse) and (max-height:500px)").matches;if(sessionStorage.getItem("intro_arrive")){sessionStorage.removeItem("intro_arrive");login=true}}catch(e){}
c.add(show?"intro-on":"intro-off");if(show&&login)c.add("ix-login");if(/[?&]ui=0\b/.test(q))c.add("ix-noui");
if("scrollRestoration"in history)history.scrollRestoration="manual"})();
</script>

<!-- ===== BODY ===== -->
<section id="intro" class="ix" aria-label="Intro">
  <div class="ix-stage">
    <canvas class="ix-gl" aria-hidden="true"></canvas>
    <div class="ix-shade" aria-hidden="true"></div>
    <div class="ix-dim" aria-hidden="true"></div>
    <div class="ix-hud"><span class="ix-brand">{{SITE_NAME}}</span><a class="ix-skip" href="#home" data-skip>Skip</a></div>
    <nav class="ix-dots" aria-label="Scenes"></nav>
    <div class="ix-heads">
      <!-- one headline per beat (intro-story.js BEATS), 1–3 words; the first is the h1 and is on screen from the first paint -->
      <h1 class="h0"><span class="rise">{{SITE_NAME}}</span></h1>
      <h2>Open It Up</h2>
      <h2>Every Layer</h2>
      <h2>One Chip</h2>
    </div>
  </div>
  <div class="ix-end" aria-hidden="true"></div>
</section>

<div id="app" class="app">
  <!-- the site. The site name in its header replays the intro: <button class="brand" type="button" data-replay>…</button> -->
</div>

<script type="module" src="/js/intro.js"></script>

<!-- On the sign-in page: before leaving for the sign-in provider, mark the arrival so "/" starts on the poster:
     try { sessionStorage.removeItem("intro_seen"); sessionStorage.setItem("intro_arrive", "1"); } catch (e) {} -->
