<!-- Research log markup. Paste the pane into <main class="main">. The ids are the contract with records.js.
     Load katex.min.css in <head> if the logs use math: <link rel="stylesheet" href="/vendor/katex/katex.min.css"> -->
<section class="tab-pane" id="pane-records" data-pane="records" hidden>
  <div class="page-head">
    <div>
      <p class="eyebrow">Research log</p>
      <h1 class="page-h">What we did each week, and what's next</h1>
    </div>
    <a class="btn ghost" id="rec-repo" target="_blank" rel="noopener"><span>GitHub folder</span><span class="ext" aria-hidden="true">↗</span></a>
  </div>
  <nav class="week-tabs" id="week-tabs" role="tablist" aria-label="Weeks"></nav>
  <details class="wk-table" id="week-table"></details>
  <div id="week-body"></div>
</section>
