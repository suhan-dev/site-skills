<!-- Demo of ios-webapp-push with a fake server and a fake device. Serve the REPOSITORY ROOT (it links the design
     system skill next door) and open /skills/ios-webapp-push/assets/demo/.
       ?ua=ios | kakao | oldios | desktop   which browser to pretend to be (default: the real one)
       ?app=1                               pretend to be the app opened from the Home Screen (standalone)
       ?state=off | on | server | denied    the server's and the device's state (default off)
       ?prefs=11 | 10 | 01 | 00             the two switches (New events, 30 minutes before) the server has saved
       ?open=push | install                 open the sheet or the pop-up at once
       ?lang=ko                             the second language
     With ?ua=ios (or kakao) the "Add to Home Screen" pop-up opens by itself half a second after the page, once per
     member in this browser; ?open=install shows it again. -->
<script>try{var t=localStorage.getItem("site_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script>
/* ---- the fake device and the fake server (demo only; push.js itself has no demo switches) ---- */
(function () {
  var q = new URLSearchParams(location.search), ua = q.get("ua"), state = q.get("state") || "off", prefs = q.get("prefs") || "11";
  var UAS = {
    ios: "Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1",
    kakao: "Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 KAKAOTALK 10.8.5",
    oldios: "Mozilla/5.0 (iPhone; CPU iPhone OS 15_7 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/15.7 Mobile/15E148 Safari/604.1",
  };
  if (UAS[ua]) {
    Object.defineProperty(navigator, "userAgent", { get: function () { return UAS[ua]; } });
    Object.defineProperty(navigator, "platform", { get: function () { return "iPhone"; } });
  }
  if (q.get("app") === "1") Object.defineProperty(navigator, "standalone", { get: function () { return true; } });
  if (q.get("lang") === "ko" || q.get("lang") === "en") try { localStorage.setItem("site_lang", q.get("lang")); } catch (e) {}

  var perm = state === "on" ? "granted" : state === "denied" ? "denied" : "default";
  var saved = { registered: state === "on", notifyNew: prefs[0] !== "0", notifyBefore: prefs[1] !== "0" };
  var fakeSub = { endpoint: "https://push.example.com/demo", toJSON: function () { return { endpoint: this.endpoint, keys: { p256dh: "demo", auth: "demo" } }; } };
  var sub = state === "on" ? fakeSub : null;
  if ("Notification" in window) {
    Object.defineProperty(Notification, "permission", { get: function () { return perm; }, configurable: true });
    Notification.requestPermission = function () { perm = "granted"; return Promise.resolve(perm); };
  }
  if ("serviceWorker" in navigator) {
    var reg = { pushManager: { getSubscription: function () { return Promise.resolve(sub); }, subscribe: function () { sub = fakeSub; return Promise.resolve(sub); } } };
    navigator.serviceWorker.register = function () { return Promise.resolve(reg); };
    Object.defineProperty(navigator.serviceWorker, "ready", { get: function () { return Promise.resolve(reg); } });
  }
  var real = window.fetch.bind(window);
  var reply = function (body, status) { return new Promise(function (ok) { setTimeout(function () { ok(new Response(JSON.stringify(body), { status: status || 200, headers: { "content-type": "application/json" } })); }, 180); }); };
  window.fetch = function (input, init) {
    var u = new URL(typeof input === "string" ? input : input.url, location.href), m = ((init && init.method) || "GET").toUpperCase();
    if (u.pathname === "/api/push" && m === "GET") return reply(state === "server" ? { ready: false, publicKey: "" } : { ready: true, publicKey: "ZGVtbw" });
    if (u.pathname === "/api/push" && m === "POST") {
      var b = JSON.parse((init && init.body) || "{}");
      if (u.search === "?read") return reply(sub ? saved : { registered: false });
      if (typeof b.notifyNew === "boolean") saved.notifyNew = b.notifyNew;
      if (typeof b.notifyBefore === "boolean") saved.notifyBefore = b.notifyBefore;
      saved.registered = true;
      return reply(saved);
    }
    if (u.pathname === "/api/me") return reply({ auth: "google", member: "alex", seen: { install: false } });
    return real(input, init);
  };
})();
</script>

<script type="module">
  import { initTheme, lockPhoneZoom } from "../../../team-site-design-system/assets/theme.js";
  import { wireLangButton, apply } from "../../../team-site-design-system/assets/i18n.js";
  import { createPush } from "../site/js/push.js";
  import { sheetDialogs } from "../../../team-site-design-system/assets/sheet.js";

  // the real markup: the bell goes first in the header's right side, the two dialogs at the end of <body>
  const html = await (await fetch("../site/push-dialogs.html")).text();
  const tpl = document.createElement("template");
  tpl.innerHTML = html;
  document.querySelector(".bar-right").prepend(tpl.content.querySelector("#push-btn"));
  document.body.append(tpl.content);
  // in a site the icon is /icons/apple-touch-icon.png; here it comes from ./icons
  document.documentElement.style.setProperty("--app-icon", `url("${new URL("icons/apple-touch-icon.png", location.href)}")`);

  initTheme({ button: document.getElementById("theme-btn") });
  wireLangButton();
  lockPhoneZoom();
  sheetDialogs(); // phones: the page stays still behind the two sheets; tap outside or pull down to close

  const push = createPush({ appName: "Lab", member: "alex", seen: { install: false }, onOpen: (url) => console.log("open", url) });
  apply();

  const q = new URLSearchParams(location.search);
  if (q.get("open") === "push") push.open();
  else if (q.get("open") === "install") push.openInstall();
  else if (!push.welcome()) setTimeout(() => push.offerInstall(), 500); // the site: ~0.5 s after the page, before the site guide
</script>
