<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="none" stroke-linecap="round">
  <!-- Sample figure for the demo chapter H1. Black on transparent: the site inverts it in dark mode. -->
  <path d="M70 24V230H470" stroke="#000" stroke-width="1.5"/>
  <path d="M466 226l4 4-4 4M66 28l4-4 4 4" stroke="#000" stroke-width="1.5"/>
  <text x="478" y="235" fill="#000" stroke="none">x</text>
  <text x="62" y="16" fill="#000" stroke="none">T</text>
  <text x="66" y="250" fill="#000" stroke="none">0</text>
  <text x="446" y="250" fill="#000" stroke="none">L</text>
  <path d="M446 230v-4" stroke="#000" stroke-width="1.2"/>
  <text x="34" y="205" fill="#000" stroke="none">T₀</text>
  <text x="34" y="64" fill="#000" stroke="none">T<tspan font-size="10" dy="3">L</tspan></text>
  <!-- t = 0: uniform initial temperature, ends held at T0 and TL -->
  <path d="M72 200V150H444V60" stroke="#000" stroke-width="1.4" stroke-dasharray="5 5"/>
  <!-- t = tau: on its way -->
  <path d="M72 200C140 160 200 150 260 140S380 112 444 60" stroke="#000" stroke-width="1.4" opacity=".55"/>
  <!-- t -> infinity: the straight steady profile -->
  <path d="M72 200L444 60" stroke="#000" stroke-width="2"/>
  <text x="300" y="166" fill="#000" stroke="none">t = 0</text>
  <text x="196" y="132" fill="#000" stroke="none" opacity=".7">t = τ</text>
  <text x="300" y="96" fill="#000" stroke="none">t → ∞</text>
</svg>
